name: Backend tests

on:
  push:
    paths: ['backend/**', 'pytest.ini', '.coveragerc', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'pytest.ini', '.coveragerc', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
