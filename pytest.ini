[pytest]
minversion = 8.3
testpaths = backend/tests
pythonpath = backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-config --strict-markers --cov --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-fail-under=80
markers =
    unit: Isolated service, schema, and utility tests.
    api: In-process HTTP contract tests with mocked dependencies.
